<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据采集与可视化后台系统</title>
    
    <!-- 引入ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <!-- 引入Element UI样式（可选，用于美化界面） -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 头部标题区域 */
        .header {
            text-align: center;
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* 筛选控件区域 */
        .filter-bar {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .filter-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .filter-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(to bottom, #667eea, #764ba2);
            border-radius: 2px;
            margin-right: 10px;
        }
        
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-group label {
            color: #555;
            font-size: 14px;
            white-space: nowrap;
        }
        
        select, input[type="date"], input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        
        select:focus, input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 500;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        /* 统计卡片区域 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .stat-card:nth-child(1) .stat-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
        .stat-card:nth-child(2) .stat-icon { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .stat-card:nth-child(3) .stat-icon { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .stat-card:nth-child(4) .stat-icon { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #888;
        }
        
        /* 图表网格 */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 25px;
        }
        
        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .chart-container {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .chart-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(to bottom, #667eea, #764ba2);
            border-radius: 2px;
            margin-right: 10px;
        }
        
        .chart-wrapper {
            width: 100%;
            height: 400px;
        }
        
        /* 数据表格区域 */
        .table-section {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        
        tr:hover {
            background: #f8f9ff;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-running {
            background: #fff3cd;
            color: #856404;
        }
        
        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .header h1 { font-size: 28px; }
            .filter-controls { flex-direction: column; align-items: stretch; }
            .chart-wrapper { height: 300px; }
        }
        
        /* 采集控制台样式 */
        .crawl-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .crawl-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 300px;
        }
        
        .crawl-input-group label {
            color: #555;
            font-size: 14px;
            white-space: nowrap;
            font-weight: bold;
        }
        
        .crawl-buttons {
            display: flex;
            gap: 10px;
        }
        
        .crawl-result-header {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        
        /* 采集模式切换标签 */
        .crawl-mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .mode-tab {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid transparent;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #666;
        }
        
        .mode-tab:hover {
            background: #f0f0f0;
            color: #667eea;
        }
        
        .mode-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        /* 字段配置区域 */
        .field-config-area {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }
        
        .field-config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .btn-add-field {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .btn-add-field:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(17, 153, 142, 0.3);
        }
        
        /* 字段行样式 */
        .field-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
            transition: all 0.3s ease;
        }
        
        .field-row:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }
        
        .field-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .field-item label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        
        .field-item input,
        .field-item select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .field-item input:focus,
        .field-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-remove {
            background: #ff4757;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            line-height: 32px;
            text-align: center;
            transition: all 0.2s;
        }
        
        .btn-remove:hover {
            background: #ff3344;
            transform: scale(1.1);
        }
        
        /* 预设模板区域 */
        .preset-templates {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .template-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .template-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        /* 结果表格样式 */
        .data-table-container {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-height: 600px;
            overflow-y: auto;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        .data-table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 12px;
            text-align: left;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .data-table img {
            max-width: 80px;
            max-height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #eee;
        }
        
        .data-table a {
            color: #11998e;
            text-decoration: none;
            word-break: break-all;
        }
        
        .data-table a:hover {
            text-decoration: underline;
            color: #0d7a6f;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部标题 -->
        <div class="header">
            <h1>📊 数据采集与可视化后台系统</h1>
            <p>通用数据采集平台 · 实时监控 · 智能分析 · 可视化展示</p>
        </div>

        <!-- 筛选控件区域 -->
        <div class="filter-bar">
            <div class="filter-title">数据筛选</div>
            <div class="filter-controls">
                <div class="filter-group">
                    <label for="dateRange">时间范围：</label>
                    <input type="date" id="startDate" />
                    <span>至</span>
                    <input type="date" id="endDate" />
                </div>
                
                <div class="filter-group">
                    <label for="datasourceSelect">数据源：</label>
                    <select id="datasourceSelect">
                        <option value="">全部数据源</option>
                        <option value="1">电商API</option>
                        <option value="2">新闻网站</option>
                        <option value="3">社交媒体</option>
                        <option value="4">金融数据</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="statusSelect">状态筛选：</label>
                    <select id="statusSelect">
                        <option value="">全部状态</option>
                        <option value="success">成功</option>
                        <option value="failed">失败</option>
                        <option value="running">运行中</option>
                    </select>
                </div>
                
                <button onclick="refreshData()">🔄 刷新数据</button>
                <button onclick="exportData()" style="background: linear-gradient(135deg, #11998e, #38ef7d);">
                    📥 导出CSV
                </button>
                <button onclick="showCrawlPanel()" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
                    🕷️ 开始采集
                </button>
            </div>
        </div>

        <!-- 采集操作面板（默认隐藏） -->
        <div class="filter-bar" id="crawlPanel" style="display: none;">
            <div class="filter-title">🕷️ 数据采集控制台</div>
            
            <!-- 模式切换 -->
            <div class="crawl-mode-tabs">
                <button class="mode-tab active" onclick="switchCrawlMode('quick')" id="tabQuick">⚡ 快速预览</button>
                <button class="mode-tab" onclick="switchCrawlMode('targeted')" id="tabTargeted">🎯 定向采集</button>
            </div>
            
            <!-- 模式1：快速预览 -->
            <div class="crawl-mode-content" id="modeQuick">
                <div class="crawl-controls">
                    <div class="crawl-input-group" style="flex: 1;">
                        <label>🌐 采集URL：</label>
                        <input type="text" id="crawlUrl" placeholder="输入网址，例如：https://example.com/products" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                    </div>
                    <div class="crawl-buttons">
                        <button onclick="triggerQuickPreview()" id="previewBtn" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;">
                            🔍 预览页面
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 模式2：定向采集 -->
            <div class="crawl-mode-content" id="modeTargeted" style="display: none;">
                <!-- 基础信息 -->
                <div class="crawl-controls" style="margin-bottom: 15px;">
                    <div class="crawl-input-group" style="flex: 1;">
                        <label>🌐 目标URL：</label>
                        <input type="text" id="targetUrl" placeholder="要采集数据的网页地址" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ddd;" onblur="autoFillFields()">
                    </div>
                    <div class="crawl-input-group">
                        <label>🏷️ 数据源名称：</label>
                        <input type="text" id="targetName" placeholder="如：华为平板产品列表" style="width: 220px; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                    </div>
                </div>
                
                <!-- 字段配置区域 -->
                <div class="field-config-area">
                    <div class="field-config-header">
                        <span>⚙️ 提取字段配置</span>
                        <button onclick="addField()" class="btn-add-field">＋ 添加字段</button>
                    </div>
                    
                    <div id="fieldsContainer">
                        <!-- 示例字段模板 -->
                        <div class="field-row" data-index="0">
                            <div class="field-item">
                                <label>字段名：</label>
                                <input type="text" class="field-name" value="标题" placeholder="如：商品名称、价格、链接等">
                            </div>
                            <div class="field-item" style="flex: 2;">
                                <label>CSS选择器：</label>
                                <input type="text" class="field-selector" value=".product-title" placeholder="如：.price, #title, h3 > a">
                                <small style="color: #666; margin-left: 8px;">提示：右键元素→检查→复制selector</small>
                            </div>
                            <div class="field-item">
                                <label>属性：</label>
                                <select class="field-attr">
                                    <option value="text">文本内容</option>
                                    <option value="href">链接地址(href)</option>
                                    <option value="src">图片地址(src)</option>
                                    <option value="alt">替代文本(alt)</option>
                                    <option value="data-*">自定义属性</option>
                                </select>
                            </div>
                            <button onclick="removeField(0)" class="btn-remove">×</button>
                        </div>
                        
                        <div class="field-row" data-index="1">
                            <div class="field-item">
                                <label>字段名：</label>
                                <input type="text" class="field-name" value="价格" placeholder="字段名">
                            </div>
                            <div class="field-item" style="flex: 2;">
                                <label>CSS选择器：</label>
                                <input type="text" class="field-selector" value=".product-price" placeholder="CSS选择器">
                            </div>
                            <div class="field-item">
                                <label>属性：</label>
                                <select class="field-attr">
                                    <option value="text">文本内容</option>
                                    <option value="href">链接地址(href)</option>
                                    <option value="src">图片地址(src)</option>
                                    <option value="alt">替代文本(alt)</option>
                                </select>
                            </div>
                            <button onclick="removeField(1)" class="btn-remove">×</button>
                        </div>
                        
                        <div class="field-row" data-index="2">
                            <div class="field-item">
                                <label>字段名：</label>
                                <input type="text" class="field-name" value="图片" placeholder="字段名">
                            </div>
                            <div class="field-item" style="flex: 2;">
                                <label>CSS选择器：</label>
                                <input type="text" class="field-selector" value=".product-img img" placeholder="CSS选择器">
                            </div>
                            <div class="field-item">
                                <label>属性：</label>
                                <select class="field-attr">
                                    <option value="text">文本内容</option>
                                    <option value="href">链接地址(href)</option>
                                    <option value="src" selected>图片地址(src)</option>
                                    <option value="alt">替代文本(alt)</option>
                                </select>
                            </div>
                            <button onclick="removeField(2)" class="btn-remove">×</button>
                        </div>
                    </div>
                    
                    <!-- 预设模板 -->
                    <div class="preset-templates">
                        <span style="font-weight: bold; color: #555;">📋 快速模板：</span>
                        <button onclick="applyTemplate('ecommerce')" class="template-btn">电商商品列表</button>
                        <button onclick="applyTemplate('news')" class="template-btn">新闻文章列表</button>
                        <button onclick="applyTemplate('table')" class="template-btn">表格数据</button>
                        <button onclick="applyTemplate('images')" class="template-btn">图片集</button>
                    </div>
                </div>
                
                <!-- 采集按钮 -->
                <div class="crawl-buttons" style="margin-top: 20px; text-align: center;">
                    <button onclick="triggerTargetedCrawl()" id="targetedCrawlBtn" style="background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 14px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);">
                        🚀 开始定向采集
                    </button>
                </div>
            </div>
            
            <!-- 通用按钮 -->
            <div style="margin-top: 15px; text-align: right;">
                <button onclick="hideCrawlPanel()" style="background: #95a5a6; color: white; padding: 10px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">
                    ✖️ 关闭面板
                </button>
            </div>
            
            <!-- 采集结果显示区 -->
            <div id="crawlResult" style="margin-top: 20px; display: none;">
                <div class="crawl-result-header">📊 采集结果</div>
                <div id="crawlResultContent"></div>
            </div>
            
            <!-- 采集进度提示 -->
            <div id="crawlProgress" style="display: none; margin-top: 15px; text-align: center; color: #667eea; font-weight: bold; padding: 20px;">
                <span class="loading-spinner"></span>
                <br><br>
                正在采集中，请稍候...
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards" id="statsCards">
            <div class="stat-card">
                <div class="stat-icon">📡</div>
                <div class="stat-value" id="totalDatasources">--</div>
                <div class="stat-label">总数据源数</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="todayCrawls">--</div>
                <div class="stat-label">今日采集次数</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-value" id="successRate">--%</div>
                <div class="stat-label">成功率</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-value" id="activeTasks">--</div>
                <div class="stat-label">活跃任务数</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
            <!-- 折线图：采集趋势 -->
            <div class="chart-container">
                <div class="chart-title">📈 采集趋势分析（折线图）</div>
                <div class="chart-wrapper" id="trendChart"></div>
            </div>
            
            <!-- 柱状图：各数据源统计 -->
            <div class="chart-container">
                <div class="chart-title">📊 数据源采集量对比（柱状图）</div>
                <div class="chart-wrapper" id="barChart"></div>
            </div>
            
            <!-- 饼图：状态分布 -->
            <div class="chart-container">
                <div class="chart-title">🥧 任务状态分布（饼图）</div>
                <div class="chart-wrapper" id="pieChart"></div>
            </div>
            
            <!-- 雷达图：多维度评估 -->
            <div class="chart-container">
                <div class="chart-title">🎯 系统性能雷达图</div>
                <div class="chart-wrapper" id="radarChart"></div>
            </div>
        </div>

        <!-- 最近记录表格 -->
        <div class="table-section">
            <div class="chart-title">📋 最近采集记录</div>
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>数据源</th>
                        <th>状态</th>
                        <th>数据条数</th>
                        <th>成功数</th>
                        <th>耗时(秒)</th>
                        <th>执行时间</th>
                    </tr>
                </thead>
                <tbody id="recordsBody">
                    <tr><td colspan="7" class="loading">正在加载数据...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==================== 全局变量与配置 ====================
        
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 图表实例存储
        let charts = {};
        
        // ==================== 工具函数 ====================
        
        /**
         * 调用后端API的通用方法
         * @param {string} url - API端点
         * @param {Object} params - 查询参数
         * @returns {Promise} API响应数据
         */
        async function fetchAPI(url, params = {}) {
            try {
                const queryString = new URLSearchParams(params).toString();
                const fullUrl = `${API_BASE}${url}${queryString ? '?' + queryString : ''}`;
                
                const response = await fetch(fullUrl);
                const result = await response.json();
                
                if (result.success) {
                    return result.data;
                } else {
                    console.error('API错误:', result.message);
                    throw new Error(result.message || '请求失败');
                }
            } catch (error) {
                console.error('网络错误:', error);
                throw error;
            }
        }
        
        /**
         * 格式化日期时间
         * @param {string} dateStr - ISO格式日期字符串
         * @returns {string} 格式化后的日期时间
         */
        function formatDateTime(dateStr) {
            if (!dateStr) return '--';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        // ==================== 初始化ECharts图表 ====================
        
        function initCharts() {
            // 初始化折线图：采集趋势
            charts.trend = echarts.init(document.getElementById('trendChart'));
            
            // 初始化柱状图：数据源对比
            charts.bar = echarts.init(document.getElementById('barChart'));
            
            // 初始化饼图：状态分布
            charts.pie = echarts.init(document.getElementById('pieChart'));
            
            // 初始化雷达图：系统性能
            charts.radar = echarts.init(document.getElementById('radarChart'));
            
            // 监听窗口大小变化，自动重绘图表
            window.addEventListener('resize', () => {
                Object.values(charts).forEach(chart => chart.resize());
            });
        }
        
        // ==================== 加载并渲染统计数据 ====================
        
        async function loadStatistics() {
            try {
                // 获取统计概览数据
                const overview = await fetchAPI('/statistics/overview');
                
                // 更新统计卡片
                document.getElementById('totalDatasources').textContent = overview.total_datasources || 0;
                document.getElementById('todayCrawls').textContent = overview.today_crawls || 0;
                document.getElementById('successRate').textContent = (overview.success_rate || 0).toFixed(1) + '%';
                document.getElementById('activeTasks').textContent = overview.active_datasources || 0;
                
                // 渲染最近记录表格
                renderRecordsTable(overview.recent_records || []);
                
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }
        
        // ==================== 渲染折线图：采集趋势 ====================
        
        async function loadTrendChart() {
            try {
                const trendData = await fetchAPI('/statistics/trend', {
                    period: 'daily',
                    days: 30,
                    datasourceId: document.getElementById('datasourceSelect').value
                });
                
                const option = {
                    title: {
                        show: false
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'cross'
                        },
                        backgroundColor: 'rgba(255,255,255,0.95)',
                        borderColor: '#eee',
                        borderWidth: 1,
                        textStyle: {
                            color: '#333'
                        }
                    },
                    legend: {
                        data: ['总采集次数', '成功次数', '失败次数'],
                        top: 10,
                        textStyle: {
                            color: '#666'
                        }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: trendData.dates || [],
                        axisLabel: {
                            rotate: 45,
                            fontSize: 11
                        }
                    },
                    yAxis: {
                        type: 'value',
                        name: '次数',
                        axisLabel: {
                            formatter: '{value}'
                        }
                    },
                    series: [
                        {
                            name: '总采集次数',
                            type: 'line',
                            smooth: true,
                            data: trendData.counts || [],
                            lineStyle: {
                                width: 3,
                                color: '#667eea'
                            },
                            areaStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(102,126,234,0.3)' },
                                    { offset: 1, color: 'rgba(102,126,234,0.05)' }
                                ])
                            },
                            itemStyle: {
                                color: '#667eea'
                            }
                        },
                        {
                            name: '成功次数',
                            type: 'line',
                            smooth: true,
                            data: trendData.success_counts || [],
                            lineStyle: {
                                width: 2,
                                color: '#43e97b'
                            },
                            itemStyle: {
                                color: '#43e97b'
                            }
                        },
                        {
                            name: '失败次数',
                            type: 'line',
                            smooth: true,
                            data: trendData.failed_counts || [],
                            lineStyle: {
                                width: 2,
                                color: '#f5576c'
                            },
                            itemStyle: {
                                color: '#f5576c'
                            }
                        }
                    ]
                };
                
                charts.trend.setOption(option);
                
            } catch (error) {
                console.error('加载趋势图数据失败:', error);
            }
        }
        
        // ==================== 渲染柱状图：数据源对比 ====================
        
        async function loadBarChart() {
            try {
                const dataSourceStats = await fetchAPI('/statistics/by-datasource');
                
                const names = dataSourceStats.map(item => item.name);
                const totals = dataSourceStats.map(item => item.total);
                const successRates = dataSourceStats.map(item => item.success_rate);
                
                const option = {
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        },
                        formatter: function(params) {
                            let result = `<strong>${params[0].name}</strong><br/>`;
                            params.forEach(param => {
                                result += `${param.marker} ${param.seriesName}: ${param.value}<br/>`;
                            });
                            return result;
                        }
                    },
                    legend: {
                        data: ['采集总量', '成功率(%)'],
                        top: 10
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: names,
                        axisLabel: {
                            rotate: 30,
                            fontSize: 12
                        }
                    },
                    yAxis: [
                        {
                            type: 'value',
                            name: '采集次数',
                            position: 'left'
                        },
                        {
                            type: 'value',
                            name: '成功率(%)',
                            position: 'right',
                            max: 100,
                            axisLabel: {
                                formatter: '{value}%'
                            }
                        }
                    ],
                    series: [
                        {
                            name: '采集总量',
                            type: 'bar',
                            barWidth: '35%',
                            data: totals,
                            itemStyle: {
                                borderRadius: [6, 6, 0, 0],
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: '#667eea' },
                                    { offset: 1, color: '#764ba2' }
                                ])
                            }
                        },
                        {
                            name: '成功率(%)',
                            type: 'line',
                            yAxisIndex: 1,
                            data: successRates,
                            smooth: true,
                            lineStyle: {
                                width: 3,
                                color: '#43e97b'
                            },
                            itemStyle: {
                                color: '#43e97b'
                            }
                        }
                    ]
                };
                
                charts.bar.setOption(option);
                
            } catch (error) {
                console.error('加载柱状图数据失败:', error);
            }
        }
        
        // ==================== 渲染饼图：状态分布 ====================
        
        async function loadPieChart() {
            try {
                const overview = await fetchAPI('/statistics/overview');
                
                const pieData = [
                    { 
                        value: overview.today_success || 0, 
                        name: '成功',
                        itemStyle: { color: '#43e97b' }
                    },
                    { 
                        value: overview.today_failed || 0, 
                        name: '失败',
                        itemStyle: { color: '#f5576c' }
                    }
                ];
                
                const option = {
                    tooltip: {
                        trigger: 'item',
                        formatter: '{b}: {c} ({d}%)'
                    },
                    legend: {
                        orient: 'vertical',
                        right: '5%',
                        top: 'center',
                        textStyle: {
                            fontSize: 13
                        }
                    },
                    series: [
                        {
                            name: '任务状态',
                            type: 'pie',
                            radius: ['40%', '70%'],
                            center: ['40%', '50%'],
                            avoidLabelOverlap: false,
                            label: {
                                show: true,
                                formatter: '{b}\n{d}%',
                                fontSize: 13
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontWeight: 'bold'
                                }
                            },
                            labelLine: {
                                show: true
                            },
                            data: pieData
                        }
                    ],
                    graphic: [{
                        type: 'text',
                        left: 'center',
                        top: '42%',
                        style: {
                            text: `总计\n${(overview.today_success || 0) + (overview.today_failed || 0)}次`,
                            textAlign: 'center',
                            fill: '#666',
                            fontSize: 14,
                            fontWeight: 'bold'
                        }
                    }]
                };
                
                charts.pie.setOption(option);
                
            } catch (error) {
                console.error('加载饼图数据失败:', error);
            }
        }
        
        // ==================== 渲染雷达图：系统性能 ====================
        
        async function loadRadarChart() {
            try {
                // 获取缓存统计信息
                const cacheStats = await fetchAPI('/cache/stats');
                
                // 构建雷达图数据（多维度性能指标）
                const hitRate = cacheStats.hit_rate || 0;
                const usageRate = cacheStats.usage_rate || 0;
                const totalRequests = cacheStats.total_requests || 0;
                
                // 归一化到0-100范围
                const normalizedHitRate = Math.min(hitRate, 100);
                const normalizedUsage = Math.min(usageRate, 100);
                const requestScore = Math.min(totalRequests / 10, 100); // 每10次请求算1分
                
                const option = {
                    tooltip: {},
                    radar: {
                        indicator: [
                            { name: '缓存命中率', max: 100 },
                            { name: '容量利用率', max: 100 },
                            { name: '请求处理能力', max: 100 },
                            { name: '数据完整性', max: 100 },
                            { name: '响应速度', max: 100 },
                            { name: '稳定性', max: 100 }
                        ],
                        shape: 'polygon',
                        radius: '65%',
                        splitNumber: 5,
                        name: {
                            textStyle: {
                                color: '#666',
                                fontSize: 12
                            }
                        },
                        splitArea: {
                            areaStyle: {
                                color: ['#f5f5f5', '#e8e8e8', '#dddddd', '#cccccc', '#bbbbbb']
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#ccc'
                            }
                        }
                    },
                    series: [{
                        type: 'radar',
                        data: [
                            {
                                value: [
                                    normalizedHitRate,
                                    normalizedUsage,
                                    requestScore,
                                    92,  // 数据完整性（模拟值）
                                    88,  // 响应速度（模拟值）
                                    95   // 稳定性（模拟值）
                                ],
                                name: '当前性能',
                                areaStyle: {
                                    color: 'rgba(102,126,234,0.3)'
                                },
                                lineStyle: {
                                    color: '#667eea',
                                    width: 2
                                },
                                itemStyle: {
                                    color: '#667eea'
                                }
                            },
                            {
                                value: [85, 60, 80, 90, 85, 90],
                                name: '目标基准',
                                areaStyle: {
                                    color: 'rgba(67,233,123,0.2)'
                                },
                                lineStyle: {
                                    color: '#43e97b',
                                    width: 2,
                                    type: 'dashed'
                                },
                                itemStyle: {
                                    color: '#43e97b'
                                }
                            }
                        ]
                    }]
                };
                
                charts.radar.setOption(option);
                
            } catch (error) {
                console.error('加载雷达图数据失败:', error);
            }
        }
        
        // ==================== 渲染最近记录表格 ====================
        
        function renderRecordsTable(records) {
            const tbody = document.getElementById('recordsBody');
            
            if (!records || records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = records.slice(0, 10).map(record => `
                <tr>
                    <td>${record.id}</td>
                    <td>${record.datasource_name || '--'}</td>
                    <td><span class="status-badge status-${record.status}">${
                        record.status === 'success' ? '✅ 成功' :
                        record.status === 'failed' ? '❌ 失败' :
                        record.status === 'running' ? '⏳ 运行中' : record.status
                    }</span></td>
                    <td>${record.total_count || 0}</td>
                    <td>${record.success_count || 0}</td>
                    <td>${record.duration ? record.duration.toFixed(2) : '--'}</td>
                    <td>${formatDateTime(record.created_at)}</td>
                </tr>
            `).join('');
        }
        
        // ==================== 采集控制函数 ====================
        
        /**
         * 生成HTML页面的友好展示
         */
        function generateHtmlDisplay(data, parsedData) {
            const title = parsedData.title || '无标题';
            const desc = parsedData.description || '无描述';
            const content = parsedData.content_preview || '';
            const links = parsedData.links || [];
            const images = parsedData.images || [];
            
            let html = `
                <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6;">
                    <!-- 页面头部信息 -->
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                        <h2 style="margin: 0 0 10px 0; font-size: 24px;">📄 ${escapeHtml(title)}</h2>
                        <p style="margin: 5px 0; opacity: 0.9; font-size: 14px;">${escapeHtml(desc)}</p>
                        <div style="margin-top: 12px; font-size: 13px; opacity: 0.8;">
                            <span>⏱️ 耗时: ${(data.crawl_time || 0).toFixed(2)}秒</span> | 
                            <span>🔗 链接: ${parsedData.total_links || links.length}个</span> | 
                            <span>🖼️ 图片: ${parsedData.total_images || images.length}个</span>
                        </div>
                    </div>
                    
                    <!-- 页面文本内容 -->
                    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <h3 style="color: #333; margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #667eea; padding-bottom: 8px;">
                            📝 页面内容摘要
                        </h3>
                        <pre style="white-space: pre-wrap; word-wrap: break-word; font-family: inherit; margin: 0; color: #555; font-size: 14px; line-height: 1.8;">${escapeHtml(content)}</pre>
                    </div>
            `;
            
            // 显示链接列表（如果有）
            if (links.length > 0) {
                html += `
                    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <h3 style="color: #333; margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #11998e; padding-bottom: 8px;">
                            🔗 页面链接 (前${links.length}个) - 点击可在新窗口打开
                        </h3>
                        <ul style="list-style: none; padding: 0; margin: 0;">
                            ${links.map(link => `
                                <li style="padding: 12px 10px; border-bottom: 1px dashed #eee; display: flex; align-items: center; transition: background 0.2s;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='white'">
                                    <span style="color: #667eea; margin-right: 12px; font-size: 18px;">🔗</span>
                                    <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" style="color: #11998e; text-decoration: none; flex: 1; font-weight: 500; font-size: 14px;" onmouseover="this.style.textDecoration='underline'; this.style.color='#0d7a6f'" onmouseout="this.style.textDecoration='none'; this.style.color='#11998e'">
                                        ${escapeHtml(link.text) || '(无文字链接)'}
                                        <span style="font-size: 11px; color: #999; font-weight: normal; margin-left: 5px;">↗</span>
                                    </a>
                                </li>
                            `).join('')}
                        </ul>
                        <div style="margin-top: 12px; padding: 10px; background: #d4edda; border-radius: 6px; font-size: 13px; color: #155724;">
                            ✅ 所有链接已转换为完整URL，可直接点击访问
                        </div>
                    </div>
                `;
            } else {
                // 没有找到链接时显示提示
                html += `
                    <div style="background: #f8d7da; padding: 25px; border-radius: 8px; text-align: center; margin-bottom: 20px; border-left: 4px solid #dc3545;">
                        <h3 style="color: #721c24; margin: 0 0 10px 0;">🔗 未检测到页面链接</h3>
                        <p style="margin: 0; color: #721c24; font-size: 14px;">该页面可能没有使用 &lt;a&gt; 标签，或者使用了JavaScript动态生成链接</p>
                    </div>
                `;
            }
            
            // 显示图片列表（如果有）
            if (images.length > 0) {
                html += `
                    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <h3 style="color: #333; margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #f5576c; padding-bottom: 8px;">
                            🖼️ 页面图片 (前${images.length}张) - 点击可查看大图
                        </h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px;">
                            ${images.map((img, index) => `
                                <div style="border: 2px solid #e1e4e8; border-radius: 10px; overflow: hidden; text-align: center; transition: all 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 5px 20px rgba(0,0,0,0.15)'" onmouseout="this.style.transform='none'; this.style.boxShadow='none'">
                                    <a href="${escapeHtml(img.src)}" target="_blank" style="display: block; text-decoration: none; color: inherit;">
                                        <img src="${escapeHtml(img.src)}" 
                                             alt="${escapeHtml(img.alt)}" 
                                             style="width: 100%; height: 150px; object-fit: cover; background: #f5f5f5;" 
                                             loading="lazy"
                                             onerror="
                                                this.onerror = null;
                                                this.style.display = 'none';
                                                this.parentElement.innerHTML = '<div style=\\'height: 150px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);\\'><span style=\\'font-size: 48px;\\'>🖼️</span></div>';
                                             " 
                                        />
                                        <div style="padding: 12px; background: white; font-size: 13px; color: #555; font-weight: bold; line-height: 1.4;">
                                            📷 ${escapeHtml(img.alt) || `图片 #${index + 1}`}
                                        </div>
                                    </a>
                                </div>
                            `).join('')}
                        </div>
                        <div style="margin-top: 12px; padding: 10px; background: #fff9e6; border-radius: 6px; font-size: 13px; color: #856404;">

        /**
         * 自动填充字段（根据URL猜测）
         */
        function autoFillFields() {
            const url = document.getElementById('targetUrl').value.trim();
            const nameInput = document.getElementById('targetName');
            
            if (!nameInput.value && url) {
                try {
                    const urlObj = new URL(url);
                    // 从URL提取可能的名称
                    const pathParts = urlObj.pathname.split('/').filter(p => p);
                    const possibleName = pathParts[pathParts.length - 1] || urlObj.hostname;
                    nameInput.value = decodeURIComponent(possibleName).replace(/[-_]/g, ' ');
                } catch (e) {
                    // URL无效时不处理
                }
            }
        }
        
        /**
         * 收集所有字段配置
         */
        function collectFields() {
            const rows = document.querySelectorAll('.field-row');
            const fields = [];
            
            rows.forEach(row => {
                const name = row.querySelector('.field-name').value.trim();
                const selector = row.querySelector('.field-selector').value.trim();
                const attr = row.querySelector('.field-attr').value;
                
                if (name && selector) {
                    fields.push({ name, selector, attr });
                }
            });
            
            return fields;
        }

        /**

        /**
         * 生成数据表格展示
         */
        function generateDataTable(data) {
            const records = data.extracted_data || [];
            const fields = data.fields_config || [];
            
            if (records.length === 0) {
                return `
                    <div style="padding: 40px; text-align: center; color: #999; background: white; border-radius: 8px;">
                        <h3 style="font-size: 48px; margin-bottom: 10px;">📭</h3>
                        <p style="font-size: 16px;">未提取到任何数据</p>
                        <p style="font-size: 13px; margin-top: 10px;">请检查CSS选择器是否正确</p>
                    </div>
                `;
            }
            
            // 构建表头
            const headerHtml = fields.map(f => `<th>${escapeHtml(f.name)}</th>`).join('');
            
            // 构建表体
            const bodyHtml = records.map(record => {
                return '<tr>' + fields.map(field => {
                    let value = record[field.name] || record[field.selector] || '--';
                    
                    // 处理不同类型的值
                    if (typeof value === 'string') {
                        // 如果是链接
                        if (field.attr === 'href' && value.startsWith('http')) {
                            return `<td><a href="${escapeHtml(value)}" target="_blank">${escapeHtml(value)}</a></td>`;
                        }
                        // 如果是图片
                        if (field.attr === 'src' && (value.startsWith('http') || value.startsWith('//'))) {
                            const imgUrl = value.startsWith('//') ? 'https:' + value : value;
                            return `<td><img src="${escapeHtml(imgUrl)}" alt="${field.name}" onerror="this.parentElement.innerText='加载失败'" loading="lazy"></td>`;
                        }
                        // 截断长文本
                        if (value.length > 100) {
                            value = value.substring(0, 100) + '...';
                        }
                    }
                    
                    return `<td title="${escapeHtml(String(value))}">${escapeHtml(String(value))}</td>`;
                }).join('') + '</tr>';
            }).join('');
            
            // 统计信息
            const statsHtml = `
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 18px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3 style="margin: 0 0 5px 0; font-size: 20px;">📊 采集成功</h3>
                        <div style="opacity: 0.9; font-size: 14px;">
                            数据源：<strong>${escapeHtml(data.datasource_name || '未命名')}</strong> | 
                            字段数：<strong>${fields.length}</strong> | 
                            记录数：<strong>${records.length}</strong>
                        </div>
                    </div>
                    <div style="text-align: right; font-size: 13px; opacity: 0.85;">
                        <div>⏱️ 耗时: ${(data.crawl_time || 0).toFixed(2)}秒</div>
                        <div>🌐 URL: ${escapeHtml(data.url || '')}</div>
                    </div>
                </div>
            `;
            
            return statsHtml + `
                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>${headerHtml}</tr>
                        </thead>
                        <tbody>
                            ${bodyHtml}
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 12px; text-align: right; font-size: 13px; color: #666;">
                    💡 提示：鼠标悬停查看完整内容 | 图片可点击放大 | 链接可在新窗口打开
                </div>
            `;
        }

                        displayText += `📄 文本内容：\n\n`;

                        displayText += `⏱️ 耗时: ${(result.data.crawl_time || 0).toFixed(2)}秒\n`;

                        contentDiv.textContent = displayText;  // 使用纯文本
                    }
                    
                    // 自动刷新统计数据
                    setTimeout(() => refreshData(), 1000);
                    
                    alert(`✅ 采集完成！耗时 ${(result.data.crawl_time || 0).toFixed(2)} 秒 | 类型: ${dataType.toUpperCase()}`);
                } else {
                    // 显示错误信息
                    let errorText = `❌ 采集失败！\n\n`;
                    errorText += `错误信息: ${result.message || '未知错误'}\n`;
                    errorText += `URL: ${urlInput}\n`;
                    errorText += `\n可能的原因：\n`;
                    errorText += `• 目标网站无法访问\n`;
                    errorText += `• 网络连接问题\n`;
                    errorText += `• URL格式不正确或需要特殊权限\n`;
                    
                    contentDiv.style.background = '#ffebee';  // 红色背景表示失败
                    contentDiv.textContent = errorText;
                    
                    alert(`❌ 采集失败: ${result.message || '未知错误'}`);
                }
                
            } catch (error) {
                console.error('❌ 采集请求异常:', error);
                
                document.getElementById('crawlProgress').style.display = 'none';
                document.getElementById('crawlResult').style.display = 'block';
                
                const contentDiv = document.getElementById('crawlResultContent');
                contentDiv.style.background = '#fff3e0';  // 橙色背景表示异常
                contentDiv.textContent = `⚠️ 请求异常：${error.message}\n\n请检查：\n• 后端服务是否正常运行\n• 网络连接是否正常\n• 控制台是否有详细错误日志`;
                
                alert(`❌ 请求异常: ${error.message}`);
                
            } finally {
                // 恢复按钮状态
                crawlBtn.disabled = false;
                crawlBtn.textContent = '🚀 立即采集';
            }
        }

        // ==================== 事件处理函数 ====================
        
        /**
         * 刷新所有数据和图表
         */
        async function refreshData() {
            // 显示加载状态
            document.querySelector('.filter-bar button').textContent = '⏳ 加载中...';
            
            try {
                // 并行加载所有数据
                await Promise.all([
                    loadStatistics(),
                    loadTrendChart(),
                    loadBarChart(),
                    loadPieChart(),
                    loadRadarChart()
                ]);
                
                console.log('✅ 所有数据已刷新');
            } catch (error) {
                alert('数据刷新失败，请检查网络连接或服务器状态');
                console.error(error);
            } finally {
                document.querySelector('.filter-bar button').textContent = '🔄 刷新数据';
            }
        }
        
        /**
         * 导出数据为CSV文件
         */
        async function exportData() {
            try {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const status = document.getElementById('statusSelect').value;
                const datasourceId = document.getElementById('datasourceSelect').value;
                
                // 构建查询参数
                const params = {};
                if (startDate) params.start_date = startDate;
                if (endDate) params.end_date = endDate;
                if (status) params.status = status;
                if (datasourceId) params.datasource_id = datasourceId;
                
                // 触发下载
                const queryString = new URLSearchParams(params).toString();
                window.location.href = `${API_BASE}/crawlrecords/export?${queryString}`;
                
                console.log('📥 开始导出CSV...');
                
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        }
        
        // ==================== 页面初始化 ====================
        
        /**
         * 页面加载完成后初始化
         */
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 数据可视化系统初始化...');
            
            // 设置默认日期范围（最近7天）
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
            document.getElementById('startDate').value = weekAgo.toISOString().split('T')[0];
            
            // 初始化所有ECharts图表实例
            initCharts();
            
            // 首次加载数据
            await refreshData();
            
            // 设置自动刷新定时器（每5分钟）
            setInterval(refreshData, 5 * 60 * 1000);
            
            console.log('✅ 系统初始化完成！');
        });
        
        // 监听筛选条件变化，自动刷新对应图表
        document.getElementById('datasourceSelect')?.addEventListener('change', () => {
            loadTrendChart();
            loadBarChart();
        });
        
        document.getElementById('statusSelect')?.addEventListener('change', () => {
            loadPieChart();
        });
    </script>
</body>
</html>
