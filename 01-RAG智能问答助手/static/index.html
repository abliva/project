<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答助手</title>
    <style>
        :root {
            --bg-primary: #0a0f1c;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --bg-input: #0d1526;
            --border-color: #1e3a5f;
            --text-primary: #e8edf5;
            --text-secondary: #8b9dc3;
            --text-muted: #4a5d82;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.15);
            --accent-secondary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 背景装饰 */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 { top: -200px; right: -100px; background: var(--accent); }
        .bg-glow-2 { bottom: -200px; left: -100px; background: var(--accent-secondary); }

        /* 布局 */
        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 新建对话按钮 */
        .new-chat-btn {
            margin: 16px 16px 8px;
            padding: 12px 16px;
            background: transparent;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .new-chat-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* 历史记录 */
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .history-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 2px;
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .history-item.active {
            background: var(--accent-glow);
            color: var(--accent);
        }

        /* 状态栏 */
        .status-bar {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
        }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 主聊天区域 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* 顶部栏 */
        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(10px);
        }
        .topbar-title {
            font-size: 15px;
            font-weight: 600;
        }
        .topbar-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 36px; height: 36px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.15s;
        }
        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* 聊天消息区 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 0;
            scroll-behavior: smooth;
        }
        .messages-wrapper {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 28px;
        }

        /* 欢迎界面 */
        .welcome-screen {
            text-align: center;
            padding: 80px 20px;
        }
        .welcome-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }
        .welcome-screen h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .welcome-screen p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 420px;
            margin: 0 auto 36px;
            line-height: 1.6;
        }
        .quick-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-action {
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-action:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* 消息气泡 */
        .message {
            margin-bottom: 24px;
            animation: msgIn 0.3s ease-out;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .message-row.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .avatar.ai {
            background: linear-gradient(135deg, var(--accent), #00a884);
        }
        .avatar.user-avatar {
            background: linear-gradient(135deg, var(--accent-secondary), #2563eb);
        }
        .msg-bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.7;
        }
        .message-row .msg-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }
        .message-row.user .msg-bubble {
            background: linear-gradient(135deg, #1a365d, #1e3a5f);
            border-color: #2563eb33;
        }
        .msg-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            padding: 0 4px;
        }
        .message-row.user .msg-meta {
            text-align: right;
        }

        /* 来源引用 */
        .source-ref {
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(0, 212, 170, 0.06);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .source-ref strong { color: var(--accent); }

        /* 打字动画 */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }
        .typing-dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* 输入区 */
        .input-area {
            padding: 20px 28px 28px;
            border-top: 1px solid var(--border-color);
            background: rgba(10, 15, 28, 0.95);
        }
        .input-wrapper {
            max-width: 780px;
            margin: 0 auto;
        }
        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px 8px 8px 18px;
            transition: all 0.2s;
        }
        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            max-height: 150px;
            min-height: 24px;
            font-family: inherit;
            padding: 8px 0;
        }
        .input-box textarea::placeholder {
            color: var(--text-muted);
        }
        .send-btn {
            width: 42px; height: 42px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #00b894);
            color: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 212, 170, 0.35);
        }
        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* 知识库面板 */
        .kb-panel {
            position: fixed;
            right: -380px;
            top: 0;
            bottom: 0;
            width: 380px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 100;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .kb-panel.open { right: 0; }
        .kb-panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .kb-panel-header h3 { font-size: 16px; font-weight: 600; }
        .kb-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .kb-stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }
        .kb-stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .kb-stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
        .kb-doc-list { list-style: none; }
        .kb-doc-item {
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 13px;
        }
        .kb-doc-name { font-weight: 600; margin-bottom: 4px; }
        .kb-doc-preview { color: var(--text-muted); font-size: 12px; line-height: 1.5; }

        /* 遮罩 */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        /* 错误提示 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            z-index: 999;
            animation: toastIn 0.3s ease-out;
            max-width: 380px;
        }
        .toast.error { background: #3b1d1d; border: 1px solid #5c2020; color: #fca5a5; }
        .toast.success { background: #1d3b2a; border: 1px solid #205c30; color: #86efac; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(30px); } }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .messages-wrapper { padding: 0 16px; }
            .input-area { padding: 16px; }
            .kb-panel { width: 100%; right: -100%; }
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">&#x1F916;</div>
                    <div class="logo-text">
                        <h1>RAG 助手</h1>
                        <span>SenseNova Powered</span>
                    </div>
                </div>
            </div>

            <button class="new-chat-btn" onclick="newChat()">
                &#xff0b; 新建对话
            </button>

            <div class="history-list" id="historyList">
                <div class="history-item active">当前对话</div>
            </div>

            <div class="status-bar">
                <span class="status-dot"></span>系统就绪 &middot; SenseNova
            </div>
        </aside>

        <!-- 主聊天区 -->
        <main class="chat-main">
            <header class="topbar">
                <span class="topbar-title">智能问答</span>
                <div class="topbar-actions">
                    <button class="icon-btn" onclick="toggleKB()" title="知识库管理">&#128218;</button>
                    <button class="icon-btn" onclick="clearMessages()" title="清空对话">&#x1F5D1;</button>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="messages-wrapper" id="messagesWrapper">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">&#x1F4AC;</div>
                        <h2>有什么可以帮您？</h2>
                        <p>基于 RAG（检索增强生成）技术的智能问答助手，结合知识库为您提供精准回答。</p>
                        <div class="quick-actions">
                            <div class="quick-action" onclick="askQuick('什么是RAG技术？')">什么是RAG技术？</div>
                            <div class="quick-action" onclick="askQuick('介绍一下深度学习的基础概念')">深度学习基础概念</div>
                            <div class="quick-action" onclick="askQuick('自然语言处理有哪些应用场景？')">NLP应用场景</div>
                            <div class="quick-action" onclick="askQuick('Transformer模型的原理是什么？')">Transformer原理</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-box">
                        <textarea
                            id="userInput"
                            placeholder="输入您的问题... (Enter发送，Shift+Enter换行)"
                            rows="1"
                            onkeydown="handleKey(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#x27A4;</button>
                    </div>
                    <div class="input-hint">基于 SenseNova 大模型 + RAG 知识库检索</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 知识库面板 -->
    <div class="overlay" id="overlay" onclick="toggleKB()"></div>
    <aside class="kb-panel" id="kbPanel">
        <div class="kb-panel-header">
            <h3>&#128218; 知识库状态</h3>
            <button class="icon-btn" onclick="toggleKB()">✕</button>
        </div>
        <div class="kb-body" id="kbBody">
            <div style="text-align:center;color:var(--text-muted);padding:40px 0;">
                加载中...
            </div>
        </div>
    </aside>

    <script>
        const API_BASE = '/api';
        let isGenerating = false;

        // 自动调整输入框高度
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        // 键盘事件处理
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // 快捷提问
        function askQuick(q) {
            document.getElementById('userInput').value = q;
            sendMessage();
        }

        // 新建对话
        function newChat() {
            clearMessages();
            showToast('已创建新对话', 'success');
        }

        // 清空消息
        function clearMessages() {
            const wrapper = document.getElementById('messagesWrapper');
            wrapper.innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">&#x1F4AC;</div>
                    <h2>有什么可以帮您？</h2>
                    <p>基于 RAG（检索增强生成）技术的智能问答助手，结合知识库为您提供精准回答。</p>
                    <div class="quick-actions">
                        <div class="quick-action" onclick="askQuick('什么是RAG技术？')">什么是RAG技术？</div>
                        <div class="quick-action" onclick="askQuick('介绍一下深度学习的基础概念')">深度学习基础概念</div>
                        <div class="quick-action" onclick="askQuick('自然语言处理有哪些应用场景？')">NLP应用场景</div>
                        <div class="quick-action" onclick="askQuick('Transformer模型的原理是什么？')">Transformer原理</div>
                    </div>
                </div>`;
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const question = input.value.trim();
            if (!question || isGenerating) return;

            input.value = '';
            autoResize(input);

            // 隐藏欢迎页
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.style.display = 'none';

            // 添加用户消息
            addMessage(question, 'user');

            // 显示AI思考中
            showTyping();

            isGenerating = true;
            updateSendButton(true);

            try {
                const resp = await fetch(API_BASE + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        stream: false,
                        use_rag: true
                    })
                });

                hideTyping();

                if (!resp.ok) {
                    const errData = await resp.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${resp.status}`);
                }

                const data = await resp.json();
                if (data.success && data.data) {
                    addMessage(data.data.answer, 'ai', data.data.sources);
                } else {
                    throw new Error(data.message || '返回数据异常');
                }
            } catch (err) {
                hideTyping();
                addMessage(`抱歉，出错了：${err.message}`, 'ai');
                showToast(err.message, 'error');
            }

            isGenerating = false;
            updateSendButton(false);
        }

        // 添加消息到界面
        function addMessage(content, role, sources) {
            const wrapper = document.getElementById('messagesWrapper');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            let sourceHtml = '';
            if (sources && sources.length > 0) {
                sourceHtml = `<div class="source-ref"><strong>参考来源：</strong>${sources.map(s => s.source || s).join('、')}</div>`;
            }

            const html = `
                <div class="message">
                    <div class="message-row ${role}">
                        <div class="avatar ${role === 'user' ? 'user-avatar' : 'ai'}">${role === 'user' ? '&#x1F464;' : '&#x1F916;'}</div>
                        <div>
                            <div class="msg-bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                            ${sourceHtml}
                            <div class="msg-meta">${time}</div>
                        </div>
                    </div>
                </div>`;

            wrapper.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // 打字指示器
        function showTyping() {
            const wrapper = document.getElementById('messagesWrapper');
            const html = `
                <div class="message" id="typingMsg">
                    <div class="message-row">
                        <div class="avatar ai">&#x1F916;</div>
                        <div>
                            <div class="msg-bubble">
                                <div class="typing-indicator">
                                    <div class="typing-dot"></div>
                                    <div class="typing-dot"></div>
                                    <div class="typing-dot"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            wrapper.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function hideTyping() {
            const el = document.getElementById('typingMsg');
            if (el) el.remove();
        }

        // 更新发送按钮状态
        function updateSendButton(disabled) {
            document.getElementById('sendBtn').disabled = disabled;
        }

        // 滚动到底部
        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Toast提示
        function showToast(msg, type = 'error') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // 知识库面板
        async function toggleKB() {
            const panel = document.getElementById('kbPanel');
            const overlay = document.getElementById('overlay');
            const isOpen = panel.classList.toggle('open');
            overlay.classList.toggle('show', isOpen);

            if (isOpen) await loadKBStatus();
        }

        async function loadKBStatus() {
            const body = document.getElementById('kbBody');
            try {
                const resp = await fetch(API_BASE + '/knowledge?detail=true');
                const data = await resp.json();

                if (!data.success) throw new Error(data.message || '加载失败');

                const d = data.data;
                body.innerHTML = `
                    <div style="display:flex;gap:12px;margin-bottom:20px;">
                        <div class="kb-stat-card" style="flex:1;">
                            <div class="kb-stat-label">文档数量</div>
                            <div class="kb-stat-value">${d.total_documents || 0}</div>
                        </div>
                        <div class="kb-stat-card" style="flex:1;">
                            <div class="kb-stat-label">文本块数</div>
                            <div class="kb-stat-value">${d.total_chunks || 0}</div>
                        </div>
                    </div>
                    ${d.documents && d.documents.length ? `
                        <h4 style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">文档列表</h4>
                        <ul class="kb-doc-list">
                            ${d.documents.map(doc => `
                                <li class="kb-doc-item">
                                    <div class="kb-doc-name">&#x1F4C4; ${doc.source}</div>
                                    <div class="kb-doc-preview">${doc.preview}</div>
                                </li>
                            `).join('')}
                        </ul>
                    ` : '<p style="color:var(--text-muted);text-align:center;padding:20px;">暂无文档</p>'}
                `;
            } catch (e) {
                body.innerHTML = `<p style="color:var(--danger);text-align:center;">加载失败：${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
